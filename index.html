<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Huis klaar voor vertrek</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#292524;background:#fafaf9}
*{box-sizing:border-box} body{margin:0} main{max-width:780px;margin:auto;padding:28px 16px 48px}.title{display:flex;gap:12px;align-items:center}.icon{width:43px;height:43px;border-radius:16px;background:#059669;color:white;display:grid;place-items:center;font-size:23px}h1{font-size:30px;margin:0} .sub{color:#78716c;margin:7px 0 0}.card{background:#fff;border:1px solid #e7e5e4;border-radius:18px;box-shadow:0 1px 3px #0000000d}.progress{margin-top:20px;padding:16px}.prow{display:flex;justify-content:space-between;font-size:14px}.bar{height:12px;background:#f5f5f4;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;background:#10b981;border-radius:99px;transition:width .2s}.controls{display:flex;gap:8px;margin:24px 0}button{font:inherit}.control{border:1px solid #e7e5e4;background:white;border-radius:12px;padding:10px 14px;cursor:pointer}.day{margin:26px 0}h2{font-size:20px;margin:0 0 9px}.count{font-size:12px;color:#a8a29e;font-weight:400;margin-left:8px}.tasks{overflow:hidden}.task{width:100%;display:flex;gap:12px;align-items:center;padding:15px;border:0;border-bottom:1px solid #f5f5f4;background:white;text-align:left;cursor:pointer;color:#292524}.task:last-child{border-bottom:0}.task:hover{background:#fafaf9}.box{width:24px;height:24px;border:2px solid #d6d3d1;border-radius:8px;display:grid;place-items:center;flex:none;font-weight:900}.task.done .box{background:#10b981;border-color:#10b981;color:white}.task.done .label{text-decoration:line-through;color:#a8a29e}.error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;padding:14px;border-radius:12px;margin-bottom:16px}.muted{color:#78716c}.footer{text-align:center;color:#a8a29e;font-size:12px;margin-top:38px}@media(max-width:540px){h1{font-size:25px}main{padding-top:18px}}
</style>
</head>
<body>
<main>
  <div class="title"><div class="icon">⌂</div><h1>Huis klaar voor vertrek ✈️</h1></div>
  <p class="sub">Luuk & Vera · samen aftikken wat nog moet gebeuren</p>
  <div class="card progress"><div class="prow"><strong id="status">Taken laden…</strong><span id="pct">0%</span></div><div class="bar"><div class="fill" id="fill" style="width:0%"></div></div></div>
  <div class="controls"><button class="control" id="hide">Verberg afgevinkt</button><button class="control" id="refresh" title="Ververs lijst">↻</button></div>
  <div id="error"></div><div id="list" class="muted">Taken laden…</div>
  <div class="footer">Tik op een taak om ’m af te vinken. De vinkjes worden gedeeld via Supabase.</div>
</main>
<script>
const SUPABASE_URL='https://ljqbfvwuzyiragabldra.supabase.co';
const SUPABASE_KEY='sb_publishable_vNbIKhJuDJNLaQjhMnxovQ_8ibTHXSc';
const API=`${SUPABASE_URL}/rest/v1/tasks`;
const headers={apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json'};
const order=['MA','DI','WOE','DO','VRIJ','OVERIG','KLAAR'];
const names={MA:'Maandag',DI:'Dinsdag',WOE:'Woensdag',DO:'Donderdag',VRIJ:'Vrijdag',OVERIG:'Nog inplannen',KLAAR:'Al gedaan'};
let items=[],hideDone=false;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function render(){const done=items.filter(x=>x.done).length,pct=items.length?Math.round(done/items.length*100):0;document.querySelector('#status').textContent=`${done} van ${items.length} klaar`;document.querySelector('#pct').textContent=`${pct}%`;document.querySelector('#fill').style.width=`${pct}%`;document.querySelector('#hide').textContent=hideDone?'Toon afgevinkt':'Verberg afgevinkt';let out='';for(const day of order){const xs=items.filter(x=>x.day===day&&(!hideDone||!x.done));if(!xs.length)continue;out+=`<section class="day"><h2>${names[day]}<span class="count">${xs.length} ${xs.length===1?'ding':'dingen'}</span></h2><div class="card tasks">`;for(const x of xs)out+=`<button class="task ${x.done?'done':''}" data-id="${x.id}"><span class="box">${x.done?'✓':''}</span><span class="label">${esc(x.task)}</span></button>`;out+='</div></section>'}document.querySelector('#list').innerHTML=out||'<span class="muted">Geen taken gevonden.</span>';document.querySelectorAll('.task').forEach(b=>b.onclick=()=>toggle(Number(b.dataset.id)))}
async function load(){document.querySelector('#error').innerHTML='';try{const r=await fetch(`${API}?select=id,task,day,done&order=id.asc`,{headers});if(!r.ok)throw new Error(await r.text());items=await r.json();render()}catch(e){document.querySelector('#list').innerHTML='';document.querySelector('#error').innerHTML=`<div class="error">Laden lukt niet: ${esc(e.message)}</div>`}}
async function toggle(id){const item=items.find(x=>x.id===id),old=item.done;item.done=!old;render();try{const r=await fetch(`${API}?id=eq.${id}`,{method:'PATCH',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({done:item.done})});if(!r.ok)throw new Error(await r.text())}catch(e){item.done=old;render();document.querySelector('#error').innerHTML=`<div class="error">Opslaan lukt niet: ${esc(e.message)}</div>`}}
document.querySelector('#hide').onclick=()=>{hideDone=!hideDone;render()};document.querySelector('#refresh').onclick=load;load();
</script>
</body>
</html>
