<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Huis to-do</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#292524;background:#fafaf9}*{box-sizing:border-box}body{margin:0}main{max-width:780px;margin:auto;padding:28px 16px 48px}.title{display:flex;gap:12px;align-items:center}.icon{width:43px;height:43px;border-radius:16px;background:#059669;color:white;display:grid;place-items:center;font-size:23px}h1{font-size:30px;margin:0}.sub{color:#78716c;margin:7px 0 0}.card{background:#fff;border:1px solid #e7e5e4;border-radius:18px;box-shadow:0 1px 3px #0000000d}.progress{margin-top:20px;padding:16px}.prow{display:flex;justify-content:space-between;font-size:14px}.bar{height:12px;background:#f5f5f4;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;background:#10b981;border-radius:99px;transition:width .2s}.controls{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}button,input,select{font:inherit}.control,.primary{border:1px solid #e7e5e4;background:white;border-radius:12px;padding:10px 14px;cursor:pointer}.primary{background:#059669;color:white;border-color:#059669;font-weight:650}.day{margin:26px 0}h2{font-size:20px;margin:0 0 9px}.count{font-size:12px;color:#a8a29e;font-weight:400;margin-left:8px}.carry h2{color:#b45309}.carry .tasks{border-color:#f59e0b}.tasks{overflow:hidden}.taskrow{display:flex;align-items:center;border-bottom:1px solid #f5f5f4;background:white}.taskrow:last-child{border-bottom:0}.task{flex:1;display:flex;gap:12px;align-items:center;padding:15px;border:0;background:transparent;text-align:left;cursor:pointer;color:#292524}.taskrow:hover{background:#fafaf9}.box{width:24px;height:24px;border:2px solid #d6d3d1;border-radius:8px;display:grid;place-items:center;flex:none;font-weight:900}.task.done .box{background:#10b981;border-color:#10b981;color:white}.task.done .label{text-decoration:line-through;color:#a8a29e}.actions{display:flex;padding-right:10px}.iconbtn{border:0;background:transparent;padding:9px;cursor:pointer;color:#78716c;border-radius:9px}.iconbtn:hover{background:#f5f5f4;color:#292524}.error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;padding:14px;border-radius:12px;margin-bottom:16px}.note{background:#fffbeb;color:#92400e;border:1px solid #fde68a;padding:12px;border-radius:12px;margin-bottom:16px}.muted{color:#78716c}.footer{text-align:center;color:#a8a29e;font-size:12px;margin-top:38px}.modalback{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modalback.open{display:flex}.modal{width:min(520px,100%);background:white;border-radius:18px;padding:20px}.modal h3{margin:0 0 16px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:650}.field input,.field select{padding:11px;border:1px solid #d6d3d1;border-radius:10px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.danger{color:#b91c1c}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}.piece{position:absolute;top:-20px;width:10px;height:16px;animation:fall 3.2s linear forwards}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(900deg);opacity:.85}}@media(max-width:540px){h1{font-size:25px}main{padding-top:18px}.actions{padding-right:5px}.iconbtn{padding:8px 6px}}
</style>
</head>
<body>
<main><div class="title"><div class="icon">⌂</div><h1>Huis to-do 🏠</h1></div><p class="sub">Luuk & Vera · samen toevoegen, aanpassen en aftikken</p><div class="card progress"><div class="prow"><strong id="status">Taken laden…</strong><span id="pct">0%</span></div><div class="bar"><div class="fill" id="fill"></div></div></div><div class="controls"><button class="primary" id="add">＋ Nieuwe taak</button><button class="control" id="hide">Verberg afgevinkt</button><button class="control" id="refresh">↻ Verversen</button></div><div id="message"></div><div id="error"></div><div id="list" class="muted">Taken laden…</div><div class="footer">Iedere maandag schuiven openstaande taken automatisch door naar ‘Resterend van vorige week’.</div></main>
<div class="modalback" id="modalback"><form class="modal" id="form"><h3 id="modaltitle">Nieuwe taak</h3><input type="hidden" id="editid"><div class="field"><label for="tasktext">Taak</label><input id="tasktext" required maxlength="160" placeholder="Wat moet er gebeuren?"></div><div class="field"><label for="day">Dag</label><select id="day"><option value="MA">Maandag</option><option value="DI">Dinsdag</option><option value="WOE">Woensdag</option><option value="DO">Donderdag</option><option value="VRIJ">Vrijdag</option><option value="OVERIG">Nog inplannen</option></select></div><div class="modalactions"><button type="button" class="control" id="cancel">Annuleren</button><button class="primary" type="submit">Opslaan</button></div></form></div><div class="confetti" id="confetti"></div>
<script>
const SUPABASE_URL='https://ljqbfvwuzyiragabldra.supabase.co',SUPABASE_KEY='sb_publishable_vNbIKhJuDJNLaQjhMnxovQ_8ibTHXSc',API=`${SUPABASE_URL}/rest/v1/tasks`,headers={apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json'},order=['MA','DI','WOE','DO','VRIJ','OVERIG'],names={MA:'Maandag',DI:'Dinsdag',WOE:'Woensdag',DO:'Donderdag',VRIJ:'Vrijdag',OVERIG:'Nog inplannen'};let items=[],hideDone=false,celebrated=false;const $=s=>document.querySelector(s);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function showError(m){$('#error').innerHTML=m?`<div class="error">${esc(m)}</div>`:''}function monday(){const d=new Date(),day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.toISOString().slice(0,10)}
function confetti(){const c=$('#confetti'),colors=['#10b981','#f59e0b','#ec4899','#3b82f6','#8b5cf6'];c.innerHTML='';for(let i=0;i<110;i++){const p=document.createElement('i');p.className='piece';p.style.left=Math.random()*100+'vw';p.style.background=colors[i%colors.length];p.style.animationDelay=Math.random()*1.1+'s';p.style.setProperty('--drift',(Math.random()*240-120)+'px');c.appendChild(p)}setTimeout(()=>c.innerHTML='',4500)}
function row(x){return `<div class="taskrow"><button class="task ${x.done?'done':''}" data-toggle="${x.id}"><span class="box">${x.done?'✓':''}</span><span class="label">${esc(x.task)}</span></button><div class="actions"><button class="iconbtn" title="Aanpassen" data-edit="${x.id}">✎</button><button class="iconbtn danger" title="Verwijderen" data-delete="${x.id}">🗑</button></div></div>`}
function render(){const done=items.filter(x=>x.done).length,pct=items.length?Math.round(done/items.length*100):0;$('#status').textContent=`${done} van ${items.length} klaar`;$('#pct').textContent=`${pct}%`;$('#fill').style.width=`${pct}%`;$('#hide').textContent=hideDone?'Toon afgevinkt':'Verberg afgevinkt';if(items.length&&done===items.length&&!celebrated){celebrated=true;confetti()}if(done<items.length)celebrated=false;let out='';for(const day of order){const xs=items.filter(x=>!x.carried_over&&x.day===day&&(!hideDone||!x.done));if(xs.length)out+=`<section class="day"><h2>${names[day]}<span class="count">${xs.length} ${xs.length===1?'ding':'dingen'}</span></h2><div class="card tasks">${xs.map(row).join('')}</div></section>`}const carry=items.filter(x=>x.carried_over&&(!hideDone||!x.done));if(carry.length)out+=`<section class="day carry"><h2>Resterend van vorige week<span class="count">${carry.length} ${carry.length===1?'ding':'dingen'}</span></h2><div class="card tasks">${carry.map(row).join('')}</div></section>`;$('#list').innerHTML=out||'<span class="muted">Geen taken gevonden.</span>';document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggle(+b.dataset.toggle));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(+b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeTask(+b.dataset.delete))}
async function request(url,opt={}){const r=await fetch(url,opt);if(!r.ok)throw new Error(await r.text());return r}
async function rollover(){const current=monday(),oldOpen=items.filter(x=>!x.done&&x.week_start!==current);for(const x of oldOpen)await patch(x.id,{week_start:current,carried_over:true});items=items.filter(x=>!x.done||x.week_start===current);if(oldOpen.length)$('#message').innerHTML=`<div class="note">Nieuwe week gestart: ${oldOpen.length} openstaande ${oldOpen.length===1?'taak is':'taken zijn'} doorgeschoven.</div>`}
async function load(){showError('');try{const current=monday(),r=await request(`${API}?select=id,task,day,done,week_start,carried_over&or=(week_start.eq.${current},done.eq.false)&order=id.asc`,{headers});items=await r.json();await rollover();render()}catch(e){$('#list').innerHTML='';showError(`Laden lukt niet: ${e.message}`)}}
async function patch(id,data){await request(`${API}?id=eq.${id}`,{method:'PATCH',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify(data)})}async function toggle(id){const x=items.find(i=>i.id===id),old=x.done;x.done=!old;render();try{await patch(id,{done:x.done})}catch(e){x.done=old;render();showError(`Opslaan lukt niet: ${e.message}`)}}
function openNew(){$('#editid').value='';$('#tasktext').value='';$('#day').value='OVERIG';$('#modaltitle').textContent='Nieuwe taak';$('#modalback').classList.add('open');$('#tasktext').focus()}function openEdit(id){const x=items.find(i=>i.id===id);$('#editid').value=id;$('#tasktext').value=x.task;$('#day').value=x.day;$('#modaltitle').textContent='Taak aanpassen';$('#modalback').classList.add('open');$('#tasktext').focus()}function closeModal(){$('#modalback').classList.remove('open')}
async function saveTask(e){e.preventDefault();showError('');const id=$('#editid').value,task=$('#tasktext').value.trim(),day=$('#day').value;if(!task)return;try{if(id){await patch(+id,{task,day});Object.assign(items.find(i=>i.id===+id),{task,day})}else{const r=await request(API,{method:'POST',headers:{...headers,Prefer:'return=representation'},body:JSON.stringify({task,day,done:false,week_start:monday(),carried_over:false})});items.push(...await r.json())}closeModal();render()}catch(e){showError(`Opslaan lukt niet: ${e.message}`);closeModal()}}
async function removeTask(id){const x=items.find(i=>i.id===id);if(!confirm(`Taak verwijderen: “${x.task}”?`))return;try{await request(`${API}?id=eq.${id}`,{method:'DELETE',headers:{...headers,Prefer:'return=minimal'}});items=items.filter(i=>i.id!==id);render()}catch(e){showError(`Verwijderen lukt niet: ${e.message}`)}}
$('#add').onclick=openNew;$('#cancel').onclick=closeModal;$('#form').onsubmit=saveTask;$('#hide').onclick=()=>{hideDone=!hideDone;render()};$('#refresh').onclick=load;$('#modalback').onclick=e=>{if(e.target===$('#modalback'))closeModal()};load();
</script></body></html>
